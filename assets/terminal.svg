<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    .bg { fill: #0d1117; }
    .bar { fill: #161b22; }
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; }
    .prompt { fill: #3fb950; }
    .cmd { fill: #e6edf3; }
    .out { fill: #8b949e; }
    .ok { fill: #58a6ff; }
    .title { fill: #8b949e; font-size: 12px; }
    .line { opacity: 0; animation: show 0.01s forwards; }
    .typing { animation: type var(--dur) steps(var(--steps)) forwards; }
    .cursor { fill: #e6edf3; opacity: 0; animation: show 0.01s forwards, blink 1s step-end infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes type { from { width: 0; } to { width: var(--w); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <clipPath id="c1"><rect class="typing" x="40" y="60" height="22" width="0" style="--dur:0.6s;--steps:6;--w:56px;animation-delay:0.4s"/></clipPath>
    <clipPath id="c2"><rect class="typing" x="40" y="114" height="22" width="0" style="--dur:0.8s;--steps:13;--w:120px;animation-delay:2s"/></clipPath>
    <clipPath id="c3"><rect class="typing" x="40" y="168" height="22" width="0" style="--dur:0.8s;--steps:14;--w:129px;animation-delay:3.8s"/></clipPath>
    <clipPath id="c4"><rect class="typing" x="40" y="222" height="22" width="0" style="--dur:1.4s;--steps:38;--w:350px;animation-delay:5.6s"/></clipPath>
  </defs>

  <rect class="bg" width="760" height="300" rx="10"/>
  <rect class="bar" width="760" height="34" rx="10"/>
  <rect class="bar" y="20" width="760" height="14"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text class="title" x="380" y="21" text-anchor="middle">cris@buenos-aires: ~</text>

  <!-- 1 -->
  <text x="20" y="76" class="prompt">$</text>
  <text x="40" y="76" class="cmd" clip-path="url(#c1)">whoami</text>
  <text x="20" y="100" class="out line" style="animation-delay:1.2s">Cristian Martinez — Full Stack Developer</text>

  <!-- 2 -->
  <text x="20" y="130" class="prompt line" style="animation-delay:1.8s">$</text>
  <text x="40" y="130" class="cmd" clip-path="url(#c2)">cat stack.txt</text>
  <text x="20" y="154" class="out line" style="animation-delay:3s">React · Next.js · Node.js · Spring Boot · PostgreSQL</text>

  <!-- 3 -->
  <text x="20" y="184" class="prompt line" style="animation-delay:3.6s">$</text>
  <text x="40" y="184" class="cmd" clip-path="url(#c3)">cat origen.txt</text>
  <text x="20" y="208" class="out line" style="animation-delay:4.8s">C &amp; assembler → Crestron → React → Full Stack → IA / MCP</text>

  <!-- 4 -->
  <text x="20" y="238" class="prompt line" style="animation-delay:5.4s">$</text>
  <text x="40" y="238" class="cmd" clip-path="url(#c4)">./buscar-trabajo --remoto --full-stack</text>
  <text x="20" y="262" class="ok line" style="animation-delay:7.3s">✔ Disponible para nuevas oportunidades</text>

  <!-- cursor -->
  <text x="20" y="288" class="prompt line" style="animation-delay:7.8s">$</text>
  <rect class="cursor" x="40" y="275" width="9" height="17" style="animation-delay:7.8s, 7.8s"/>
</svg>
